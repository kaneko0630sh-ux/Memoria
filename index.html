/* ---- import / export ---- */
function pngText(buf) {
  const v = new DataView(buf), u8 = new Uint8Array(buf), out = {}, dec = new TextDecoder('latin1');
  if (u8.length < 8 || v.getUint32(0) !== 0x89504e47) return out;
  let p = 8;
  while (p + 8 <= u8.length) {
    const len = v.getUint32(p), type = dec.decode(u8.subarray(p + 4, p + 8)), data = u8.subarray(p + 8, p + 8 + len);
    if (type === 'tEXt') { const z = data.indexOf(0); out[dec.decode(data.subarray(0, z))] = dec.decode(data.subarray(z + 1)); }
    else if (type === 'iTXt') {
      const z = data.indexOf(0), key = dec.decode(data.subarray(0, z));
      if (!data[z + 1]) { let q = data.indexOf(0, z + 3) + 1; q = data.indexOf(0, q) + 1; out[key] = new TextDecoder().decode(data.subarray(q)); }
    }
    if (type === 'IEND') break;
    p += 12 + len;
  }
  return out;
}
function bookText(entries) {
  return (entries || []).filter(e => e && e.enabled !== false && !e.disable && (e.content || '').trim())
    .map(e => `■ ${e.comment || e.name || [].concat(e.keys || e.key || []).join(' / ') || '項目'}\n${e.content.trim()}`).join('\n\n');
}
function loreFromJSON(j) {
  let entries = j.entries ? (Array.isArray(j.entries) ? j.entries : Object.values(j.entries)) : Array.isArray(j) ? j : [];
  if (!entries.length && j.data?.character_book) entries = j.data.character_book.entries || [];
  entries = entries.slice().sort((a, b) => (a.order ?? a.insertion_order ?? 0) - (b.order ?? b.insertion_order ?? 0));
  const text = bookText(entries);
  if (!text) throw new Error('ロアブックの項目が見つかりませんでした');
  return text;
}
function cardData(j) { return j.data && typeof j.data === 'object' ? j.data : j; }
function cardToChar(j, avatar = '') {
  const d = cardData(j);
  return { id: uid(), name: d.name || '名無し', avatar, profile: [d.description, d.scenario].filter(Boolean).join('\n\n'), personality: d.personality || '', examples: d.mes_example || '',
    note: [d.system_prompt, d.post_history_instructions].filter(Boolean).join('\n').replace(/\{\{original\}\}/g, '').trim() };
}
function cardToStory(j, avatar = '', cover = '') {
  const d = cardData(j), c = cardToChar(j, avatar);
  return { id: uid(), title: d.name || '名無し', cover, description: (d.creator_notes || d.description || '').replace(/\s+/g, ' ').slice(0, 80), tags: (d.tags || []).slice(0, 6),
    chars: [c], world: bookText(d.character_book?.entries), direction: '', userRole: '', opening: d.first_mes || '', createdAt: now(), updatedAt: now() };
}
async function readCard(f) {
  if (/\.png$/i.test(f.name) || f.type === 'image/png') {
    const t = pngText(await f.arrayBuffer()), b64 = t.chara || t.ccv3;
    if (!b64) throw new Error('この画像にはキャラクター情報が含まれていません');
    return { json: JSON.parse(b64utf8(b64)), avatar: await fileToImage(f, 320, 320), cover: await fileToImage(f, 600, 800) };
  }
  return { json: JSON.parse(await f.text()), avatar: '', cover: '' };
}
function withNewIds(story) {
  const st = clone(story);
  st.id = uid();
  st.chars = (st.chars || []).map(c => ({ ...c, id: uid() }));
  st.createdAt = st.updatedAt = now();
  return st;
}
function pick(kind, accept) { const i = $('#filePick'); i.value = ''; i.accept = accept; S.pickKind = kind; i.click(); }
async function handleFile(kind, f) {
  if (kind === 'cover') { S.draft.cover = await fileToImage(f, 600, 800); render(); return; }
  if (kind === 'charAvatar') { S.charDraft.avatar = await fileToImage(f, 320, 320); setSheetBody('char', charSheetHTML()); return; }
  if (kind === 'personaAvatar') { S.settings.persona.avatar = await fileToImage(f, 256, 256); await saveSettings(); render(); return; }
  if (kind === 'cardToDraft') {
    const { json, avatar } = await readCard(f), d = cardData(json);
    S.draft.chars.push(cardToChar(json, avatar));
    if (!S.draft.opening?.trim() && d.first_mes) S.draft.opening = d.first_mes;
    if (!S.draft.world?.trim() && d.character_book?.entries?.length) S.draft.world = bookText(d.character_book.entries);
    render();
    toast(`「${d.name}」を追加しました`, 'ok');
    return;
  }
  if (kind === 'lorebook') {
    const text = loreFromJSON(JSON.parse(await f.text()));
    S.draft.world = (S.draft.world?.trim() ? S.draft.world.trim() + '\n\n' : '') + text;
    render();
    toast(`ロアブックを取り込みました（${text.length.toLocaleString()}字）`, 'ok');
    return;
  }
  if (kind === 'story') {
    let st;
    if (/\.png$/i.test(f.name) || f.type === 'image/png') { const r = await readCard(f); st = cardToStory(r.json, r.avatar, r.cover); }
    else {
      const j = JSON.parse(await f.text());
      if (j.app === 'memoria-story' && j.story) st = withNewIds(j.story);
      else if (j.app === 'memoria') throw new Error('これはバックアップです。マイページ →「バックアップを読み込む」から読み込んでください');
      else st = cardToStory(j);
    }
    S.stories.push(st);
    await DB.put('stories', st);
    toast(`プロット「${st.title}」を読み込みました`, 'ok');
    go('story', { id: st.id });
    return;
  }
  if (kind === 'backup') {
    const j = JSON.parse(await f.text());
    if (j.app !== 'memoria') throw new Error('Memoria のバックアップファイルではありません');
    const n = [(j.stories || []).length, (j.chats || []).length];
    if (!confirm(`プロット${n[0]}件・トーク${n[1]}件を読み込みます。同じIDのデータは上書きされます。よろしいですか？`)) return;
    for (const k of ['stories', 'chats']) {
      for (const item of j[k] || []) {
        if (k === 'chats') { item.mem = deepMerge(newMem(), item.mem || {}); item.snaps ||= []; }
        const i = S[k].findIndex(x => x.id === item.id);
        if (i >= 0) S[k][i] = item; else S[k].push(item);
        await DB.put(k, item);
      }
    }
    if (j.chars || j.worlds || j.plots) await migrateV1(j.chars || [], j.worlds || [], j.plots || []);
    if (j.settings && confirm('設定も読み込みますか？（APIキーが含まれていない場合は現在のキーを残します）')) {
      const keys = S.settings.keys;
      S.settings = deepMerge(DEFAULTS, j.settings);
      for (const p of Object.keys(keys)) if (!S.settings.keys[p]) S.settings.keys[p] = keys[p];
      await saveSettings();
      applyUI();
    }
    toast('バックアップを読み込みました', 'ok');
    render();
  }
}

// v1（キャラ・世界・プロットが別々）のデータを、キャラ入りプロットへ変換
async function migrateV1(oldChars, oldWorlds, oldPlots) {
  const toEmb = c => ({ id: c.id, name: c.name, avatar: c.avatar || '', profile: [c.description, c.scenario].filter(Boolean).join('\n\n'), personality: c.personality || '', examples: c.examples || '', note: [c.charNote, c.lore].filter(Boolean).join('\n\n') });
  const used = new Set();
  for (const chat of S.chats) {
    if (chat.storyId) continue;
    const chars = (chat.charIds || []).map(id => oldChars.find(c => c.id === id)).filter(Boolean);
    chars.forEach(c => used.add(c.id));
    const w = oldWorlds.find(x => x.id === chat.worldId), p = oldPlots.find(x => x.id === chat.plotId);
    const st = { id: uid(), title: chat.title || chars[0]?.name || '無題', cover: '', description: (chars[0]?.description || '').replace(/\s+/g, ' ').slice(0, 80), tags: [], chars: chars.map(toEmb),
      world: w?.content || '', direction: p?.content || '', userRole: '', opening: chars[0]?.firstMessage || '', createdAt: chat.createdAt || now(), updatedAt: now() };
    S.stories.push(st);
    chat.storyId = st.id;
    await DB.put('stories', st);
    await DB.put('chats', chat);
  }
  for (const c of oldChars) {
    if (used.has(c.id) || S.stories.some(s => s.chars.some(x => x.id === c.id))) continue;
    const st = { id: uid(), title: c.name, cover: '', description: (c.description || '').replace(/\s+/g, ' ').slice(0, 80), tags: [], chars: [toEmb(c)], world: '', direction: '', userRole: '', opening: c.firstMessage || '', createdAt: c.createdAt || now(), updatedAt: now() };
    S.stories.push(st);
    await DB.put('stories', st);
  }
}

  // chat

  stop: () => S.gen?.ctrl.abort(),
  toBottom: () => { const sc = $('#msgs'); if (sc) sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' }); },
  aiTurnBtn: () => { const c = curChat(); if (c && !S.gen) aiTurn(c); },
  insertAst: () => {
    const ta = $('#input'), chat = curChat();
    const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s, sel = ta.value.slice(s, e);
    ta.value = ta.value.slice(0, s) + '*' + sel + '*' + ta.value.slice(e);

  },
  useChoice: t => { const chat = curChat(); const c = chat?.lastChoices?.items[Number(t.dataset.i)]; if (c) { chat.lastChoices = null; renderChoices(chat); send(c); } },
  msgTap: t => {
    if (String(window.getSelection?.() || '').length) return;

  },
  showMore: () => { const c = curChat(); S.showN[c.id] = (S.showN[c.id] || 80) + 80; renderMessages(c, { keep: true }); },
  swipePrev: t => {
    const chat = curChat(), msg = chat.messages.find(m => m.id === Number(t.dataset.id));
    if (!msg || S.gen || msg.sw === 0) return;
    msg.sw--; saveChat(chat); renderMessages(chat, { keep: true });
  },
  swipeNext: t => {
    const chat = curChat(), msg = chat.messages.find(m => m.id === Number(t.dataset.id));
    if (!msg || S.gen) return;
    if (msg.sw < msg.swipes.length - 1) { msg.sw++; saveChat(chat); renderMessages(chat, { keep: true }); }
    else generate(chat, { regenMsg: msg });
  },
  regen: t => {
    const w = t.closest('.sheet-wrap'), chat = curChat();
    if (w) closeSheet(w);
    const msg = lastDialog(chat);

  },
  contMsg: t => { const w = t.closest('.sheet-wrap'); if (w) closeSheet(w); const c = curChat(); if (c) generate(c, { mode: 'continue' }); },
  mCopy: async t => {
    const w = t.closest('.sheet-wrap'), chat = getChat(w.dataset.chat), msg = chat.messages.find(m => m.id === Number(w.dataset.msg));
    closeSheet(w);
    await copyText(txt(msg));
    toast('コピーしました', 'ok', 1500);
  },
  mBookmark: async t => {
    const w = t.closest('.sheet-wrap'), chat = getChat(w.dataset.chat), msg = chat.messages.find(m => m.id === Number(w.dataset.msg));

  },
  mEdit: t => {

    openSheet({ id: 'edit', title: 'メッセージを編集', data: { chat: chat.id, msg: msg.id }, html: `<textarea id="editText" class="edit-area">${esc(txt(msg))}</textarea>

      <div class="btn-row end"><button class="btn" data-act="closeSheet">キャンセル</button><button class="btn primary" data-act="mSaveEdit">保存</button></div>` });
  },
  mSaveEdit: async t => {

    if (!msg) return closeSheet(w);

    touch(chat);
    await saveChat(chat);
    closeSheet(w);
    renderMessages(chat, { keep: true });
  },
  mDelete: async t => {

    closeSheet(w);
    if (!msg) return;
    if (S.gen?.chatId === chat.id) return toast('生成中は削除できません', 'warn');
    chat.messages.splice(chat.messages.indexOf(msg), 1);
    touch(chat);
    await saveChat(chat);
    renderMessages(chat, { keep: true });
    toast(msg.id <= chat.mem.lastId ? '削除しました（記憶に反映済みの内容は残っています）' : '削除しました', '', 3000);
  },
  mRewind: async t => {
    const w = t.closest('.sheet-wrap'), chat = getChat(w.dataset.chat), msg = chat.messages.find(m => m.id === Number(w.dataset.msg));
    closeSheet(w);
    if (!msg) return;
    if (S.gen?.chatId === chat.id) return toast('生成中は操作できません', 'warn');
    const i = chat.messages.indexOf(msg), n = chat.messages.length - i;
    if (!confirm(`このメッセージ以降の${n}件を削除して巻き戻します。よろしいですか？`)) return;
    const r = restoreMemoryBefore(chat, msg.id);
    chat.messages.splice(i);
    chat.lastChoices = null;
    if (msg.role === 'user') { S.drafts[chat.id] = txt(msg); const ta = $('#input'); if (ta) { ta.value = txt(msg); autosize(ta); } }
    touch(chat);
    await saveChat(chat);
    renderMessages(chat);
    renderChoices(chat);
    toast(r === 'ok' ? '巻き戻しました（記憶もこの時点へ復元）' : r === 'fail' ? '巻き戻しました。※古すぎるため記憶は戻せませんでした。記憶パネルで確認してください。' : '巻き戻しました', r === 'fail' ? 'warn' : 'ok', 4000);

  deleteChat: async t => {

    closeAllSheets();
    if (S.stack.at(-1).v === 'chat') S.stack.pop();
    render();
    toast('削除しました');
  },
  profileSheet: t => {
    const chat = chatFrom(t);
    closeAllSheets();
    openSheet({ id: 'profile', title: 'トークプロフィール', data: { chat: chat.id }, html: `
      <label class="field"><span>このトークでのあなたの名前</span><input id="pf-name" value="${esc(chat.userName)}"></label>
      <label class="field"><span>このトークでのあなたの設定</span><textarea id="pf-desc" rows="5" placeholder="外見・立場・性格など">${esc(chat.userDesc || '')}</textarea></label>
      <p class="hint">アイコン画像はマイページのプロフィールで変更できます。</p>
      <div class="btn-row end"><button class="btn" data-act="closeSheet">キャンセル</button><button class="btn primary" data-act="saveProfile">保存</button></div>` });
  },
  saveProfile: async t => {

    chat.userDesc = $('#pf-desc', w).value;

    closeSheet(w);
    render();

  toggleChoices: async t => {

    setSheetBody('drawer', drawerHTML(chat));
    renderChoices(chat);
    toast(chat.choices ? '選択肢: 使用する（応答のたびに記憶用モデルで提案します）' : '選択肢: 使用しない', '', 2500);
  },
  noteSheet: t => {
    const chat = chatFrom(t);
    closeAllSheets();
    openSheet({ id: 'note', title: '作者メモ', data: { chat: chat.id }, html: `
      <p class="hint" style="margin:0 0 10px">このトークの展開への指示です。毎ターンAIに渡されます（本文では言及されません）。</p>
      <textarea id="noteText" rows="6" placeholder="例: そろそろ二人きりになる場面へ。天気は雨に。">${esc(chat.note || '')}</textarea>
      <div class="btn-row end"><button class="btn" data-act="closeSheet">キャンセル</button><button class="btn primary" data-act="saveNote">保存</button></div>` });
  },
  saveNote: async t => { const w = t.closest('.sheet-wrap'), chat = getChat(w.dataset.chat); chat.note = $('#noteText', w).value; await saveChat(chat); closeSheet(w); toast('作者メモを保存しました', 'ok', 1500); },
  bookmarks: t => {
    const chat = chatFrom(t), list = chat.messages.filter(m => m.bm);
    closeAllSheets();
    openSheet({ id: 'bms', title: `ブックマーク（${list.length}）`, data: { chat: chat.id }, html: list.length
      ? `<div class="menu">${list.map(m => `<button data-act="jumpMsg" data-id="${m.id}">${ic('bookmark')}<span style="flex:1;min-width:0">${esc(plainText(txt(m)).slice(0, 80))}<small>${tl(m.turn)}</small></span></button>`).join('')}</div>`
      : '<p class="empty-s">メッセージをタップ →「ブックマーク」で追加できます。</p>' });

  jumpMsg: t => {

    const need = chat.messages.length - idx;

    const el = $(`#msgs .msg[data-id="${t.dataset.id}"]`);

    const chat = chatFrom(t), st = getStory(chat.storyId);

  // memory panel
  memory: t => {
    const chat = chatFrom(t);
    closeAllSheets();
    if (!chat) return;
    S.memEditing = null;
    openSheet({ id: 'memory', title: '記憶', full: true, data: { chat: chat.id }, html: memoryHTML(chat), onClose: () => { S.memEditing = null; } });
  },
  memTab: t => { S.memTab = t.dataset.tab; S.memEditing = null; refreshMem(true); },
  memUpdateNow: t => {
    const chat = chatFrom(t), last = chat?.messages.at(-1);
    if (!last) return toast('まだメッセージがありません');
    if (S.gen?.chatId === chat.id) return toast('生成が終わってから実行してください', 'warn');
    queueMemory(chat, last.id);
    toast('記憶を更新しています…', '', 1800);
  },
  memPin: async t => { const chat = chatFrom(t), e = chat.mem.entries.find(x => x.id === t.dataset.eid); if (!e) return; e.pinned = !e.pinned; await saveChat(chat); refreshMem(); toast(e.pinned ? '固定しました（自動の圧縮・削除から保護）' : '固定を解除しました', '', 2000); },
  memEdit: t => { S.memEditing = t.dataset.eid; refreshMem(); $('#memEditText')?.focus(); },
  memCancelEdit: () => { S.memEditing = null; refreshMem(); },
  memSaveEdit: async t => {
    const chat = chatFrom(t), e = chat.mem.entries.find(x => x.id === t.dataset.eid), text = $('#memEditText').value.trim();
    if (e && text) { e.text = text; e.imp = clampImp($('#memEditImp').value); if (e.src === 'auto') e.src = 'manual'; await saveChat(chat); }
    S.memEditing = null;
    refreshMem();
  },
  memDel: async t => {
    const chat = chatFrom(t), e = chat.mem.entries.find(x => x.id === t.dataset.eid);
    if (!e || !confirm(`この記憶を削除しますか？\n\n${e.text}`)) return;
    chat.mem.entries = chat.mem.entries.filter(x => x !== e);
    await saveChat(chat);
    refreshMem();
  },
  memAdd: async t => {
    const chat = chatFrom(t), text = $('#memNew').value.trim();
    if (!text) return toast('内容を入力してください', 'warn');
    chat.mem.entries.push({ id: 'm' + (++chat.mem.seq), scope: t.dataset.scope, text, imp: clampImp($('#memNewImp').value), tag: '', turn: chat.mem.turn, src: 'manual' });
    await saveChat(chat);
    refreshMem();
    toast('記憶を追加しました', 'ok', 1500);
  },
  memSaveState: async t => { const chat = chatFrom(t); chat.mem.state = $('#memState').value.trim(); await saveChat(chat); toast('現在の状況を保存しました', 'ok', 1500); },
  memConsolidate: t => { const chat = chatFrom(t); queueMemory(chat, chat.mem.lastId, { consolidateScope: t.dataset.scope }); toast('整理・圧縮しています…', '', 1800); },
  chronEdit: t => { S.memEditing = t.dataset.eid; refreshMem(); $('#memEditText')?.focus(); },
  chronSave: async t => {
    const chat = chatFrom(t), c = chat.mem.chronicle.find(x => x.id === t.dataset.eid), text = $('#memEditText').value.trim();
    if (c && text) { c.text = text; await saveChat(chat); }
    S.memEditing = null;
    refreshMem();
  },
  chronDel: async t => {
    const chat = chatFrom(t), c = chat.mem.chronicle.find(x => x.id === t.dataset.eid);
    if (!c || !confirm('このあらすじを削除しますか？ 該当期間の出来事はAIに伝わらなくなります。')) return;
    chat.mem.chronicle = chat.mem.chronicle.filter(x => x !== c);
    await saveChat(chat);
    refreshMem();
  },
  memRebuild: async t => {
    const chat = chatFrom(t), n = chat.messages.filter(isDialog).length;
    if (!confirm(`全${n}件のメッセージから記憶とあらすじを作り直します。APIを約${Math.ceil(n / MEM_BATCH)}回以上呼び出すため費用と時間がかかります。続けますか？`)) return;
    const log = chat.mem.log, rev = chat.mem.rev + 1;
    chat.mem = newMem();
    chat.mem.rev = rev;
    chat.mem.log = log;
    chat.snaps = [];
    memLog(chat, '記憶の作り直しを開始しました');
    await saveChat(chat);
    refreshMem();
    const last = chat.messages.at(-1);
    if (last) queueMemory(chat, last.id);
  },
  memReset: async t => {
    const chat = chatFrom(t);
    if (!confirm('記憶項目と「現在の状況」をすべて消します（あらすじは残ります）。よろしいですか？')) return;
    chat.mem.entries = [];
    chat.mem.state = '';
    chat.mem.rev++;
    chat.mem.lastId = Math.max(chat.mem.lastId, chat.messages.at(-1)?.id || 0);
    memLog(chat, '記憶項目をすべて消去しました');
    await saveChat(chat);
    refreshMem();
  },

  // settings
  pickPersonaAvatar: () => pick('personaAvatar', 'image/*'),
  toggleKey: t => { const i = t.parentElement.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; t.textContent = i.type === 'password' ? '表示' : '隠す'; },
  pickModel: async t => {

    toast('モデル: ' + t.dataset.m, 'ok', 1500);

  testApi: async t => {
    const role = t.dataset.role, cfg = llmCfg(role);

    try {
      const r = await callLLM({ role, kind: 'test', system: [{ text: 'You are a connection test.' }], messages: [{ role: 'user', content: '「接続OK」とだけ返答してください。' }], maxTokens: 1024 });
      toast(`成功: ${(r.text || '（空の応答）').trim().slice(0, 60)}`, 'ok', 4000);

  exportAll: () => {
    const withKeys = $('#expKeys')?.checked;
    const settings = clone(S.settings);
    if (!withKeys) settings.keys = {};
    saveFile(`memoria-backup-${ymd()}.json`, JSON.stringify({ app: 'memoria', version: 2, exportedAt: new Date().toISOString(), settings, stories: S.stories, chats: S.chats }));
  },
  importBackup: () => pick('backup', '.json,application/json'),
  wipeAll: async () => {
    if (!confirm('すべてのプロット・トーク・設定を削除します。元に戻せません。')) return;
    if (!confirm('本当に削除しますか？（先にバックアップを書き出すことをおすすめします）')) return;
    for (const s of ['kv', 'chars', 'worlds', 'plots', 'chats', 'stories']) await DB.clear(s);
    location.reload();
  },
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(t, e)).catch(err => { console.error(err); toast(err.message || String(err), 'err', 6000); });
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-set]');
  if (!el) return;
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.dataset.num) { if (el.value === '' || isNaN(Number(el.value))) return; v = Number(el.value); }
  else v = el.value;
  setPath(S.settings, el.dataset.set, v);
  saveSettings();
  applyUI();
  if (el.dataset.rerender) render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheets .sheet-wrap')) closeSheet(); });
$('#filePick').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try { await handleFile(S.pickKind, f); } catch (err) { toast('読み込みに失敗しました: ' + err.message, 'err', 6000); }
});
window.visualViewport?.addEventListener('resize', fitViewport);
window.visualViewport?.addEventListener('scroll', fitViewport);
addEventListener('resize', fitViewport);
addEventListener('beforeunload', e => { if (S.gen || Object.keys(S.memJobs).length) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- init ---------- */
(async function init() {
  fitViewport();
  makeIcon();
  try { await DB.open(); } catch (e) {
    document.body.innerHTML = '<p style="padding:32px;color:#eee;font-family:sans-serif">ストレージ（IndexedDB）を開けませんでした。プライベートブラウズを解除するか、別のブラウザでお試しください。</p>';
    return;
  }
  const st = await DB.get('kv', 'settings');
  S.settings = deepMerge(DEFAULTS, st?.data || {});
  let oldChars, oldWorlds, oldPlots;
  [S.stories, S.chats, oldChars, oldWorlds, oldPlots] = await Promise.all(['stories', 'chats', 'chars', 'worlds', 'plots'].map(s => DB.all(s)));
  for (const c of S.chats) { c.mem = deepMerge(newMem(), c.mem || {}); c.snaps ||= []; }
  if (S.chats.some(c => !c.storyId) || (!S.stories.length && oldChars.length)) {
    await migrateV1(oldChars, oldWorlds, oldPlots);
    await Promise.all(['chars', 'worlds', 'plots'].map(s => DB.clear(s)));
  }
  S.stories.forEach(s => { s.chars ||= []; s.tags ||= []; });
  applyUI();
  render();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyUI);
  navigator.storage?.persist?.().catch(() => {});
})();
</script>
</body>
